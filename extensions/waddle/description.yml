extension:
  name: waddle
  description: Provides a hello world example demo (test)
  version: 0.0.2
  language: C++
  build: cmake
  license: MIT
  maintainers:
    - hannes

  # (Optional) param that specifies required extra toolchains
  requires_toolchains: "rust"
  # (Optional) param that specifies a precise vcpkg commit to use. Uses COMMUNITY_EXTENSION_VCPKG_COMMIT by default
  # vcpkg_commit: "cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3"
  # (Optional) this extension requires additional custom toolchain setup
  custom_toolchain_script: true
  # (Optional) ';' separated list of additional platforms
  opt_in_platforms: "windows_arm64;"

repo:
  github: duckdb/extension-template
  ref: fd1d3a78f95168640b1354e115b40d8abb5d5931
  variegata: 74324aaabde4cd1e4f13f7c3ff37953d08d41a52

docs:
  hello_world: |
    SELECT waddle('DuckDB!');
  extended_description: |
    The waddle extension is based on DuckDB's [Extension Template](https://github.com/duckdb/extension-template/), and it's a great starting point to get started building more advanced extensions.
